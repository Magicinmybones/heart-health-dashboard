document.documentElement.className+=" pre";window.__pre=setTimeout(function(){document.documentElement.classList.remove("pre")},4000);</script>
<style>
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; width:100%; overflow:hidden;
             background:#0b1024; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

  #bg{ position:fixed; left:50%; top:50%; width:1920px; height:1440px;
        transform:translate(-50%,-50%); transform-origin:50% 50%;
        z-index:0; user-select:none; -webkit-user-drag:none; }

  /* ============================ TYPOGRAPHY ============================
     One variable typeface (Archivo, wght 100-900) carries the whole screen.
     Roles below are the complete inventory of text styles in this design;
     every text node uses one of them - no per-element font declarations. */
  @font-face{
    font-family:'Archivo';
    src:url(assets/fonts/archivo.woff2) format('woff2-variations');
    font-weight:100 900; font-style:normal; font-display:block;
  }
  :root{
    /* The screen is one fixed canvas that is scaled to the viewport. These four
       numbers describe it: the canvas box, and the box that must stay visible
       inside it. The tablet architecture swaps them for a portrait canvas. */
    --canvas-w:1920; --canvas-h:1440;   /* design canvas */
    --fit-w:1728;    --fit-h:1036;      /* must-stay-visible box */
    --shift-x:0px;   --shift-y:0px;     /* recentres the canvas when it is trimmed */
    --flow:0;        --fit-vh:620;      /* 1 = canvas scrolls instead of being framed */

    --font-sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;

    /* Weight scale - Archivo wght-axis positions, calibrated so that rendered
       stroke thickness matches the prototype at each optical size. The
       prototype's face carries an optical-size axis (thin strokes at display
       sizes, denser strokes at UI sizes); Archivo does not, so that behaviour
       is expressed here as size-specific steps rather than one flat weight. */
    /* Global stroke-density trim. Every role weight below is offset by this
       single value, so the whole screen can be made lighter or heavier without
       touching the individual roles. 0 = calibrated stem match. */
    --fw-adjust:-120;

    --fw-display:360;      /* 85px  - display */
    --fw-metric:325;       /* 25px  - readout label */
    --fw-regular:380;      /* 39px  - callout heading */
    --fw-medium:470;        /* 20px  - body copy */
    --fw-medium-plus:490; /* 25px  - inline link */
    --fw-semibold:520;    /* 22-31px - card headline, button */
    --fw-bold:575;            /* 20-25px - emphasised label, metric */
    --fw-chip:560;            /* 19px  - filter pills */

    /* role: display - screen title */
    --t-display-size:85.5px;
    --t-display-leading:77px;
    --t-display-tracking:-0.0193em;
    --t-display-weight:calc(var(--fw-display) + var(--fw-adjust));

    /* role: heading - callout headline */
    --t-heading-size:39px;
    --t-heading-leading:41px;
    --t-heading-tracking:-0.0085em;
    --t-heading-weight:calc(var(--fw-regular) + var(--fw-adjust));

    /* role: subhead - card headline */
    --t-subhead-size:31px;
    --t-subhead-leading:35px;
    --t-subhead-tracking:0.0061em;
    --t-subhead-weight:calc(var(--fw-semibold) + var(--fw-adjust));

    /* role: body - running copy */
    --t-body-size:20px;
    --t-body-leading:29px;
    --t-body-tracking:0.0123em;
    --t-body-weight:calc(var(--fw-medium) + var(--fw-adjust));

    /* role: label - buttons and inline UI labels */
    --t-label-size:22px;
    --t-label-tracking:0.013em;
    --t-label-weight:calc(var(--fw-semibold) + var(--fw-adjust));

    /* role: label-strong - emphasised label above body copy */
    --t-labelstrong-size:20.5px;
    --t-labelstrong-tracking:0.0072em;
    --t-labelstrong-weight:calc(var(--fw-bold) + var(--fw-adjust));

    /* role: chip - filter pills */
    --t-chip-size:19px;
    --t-chip-tracking:0.0em;
    --t-chip-weight:calc(var(--fw-chip) + var(--fw-adjust));

    /* role: metric - readout pill */
    --t-metric-size:24.5px;
    --t-metric-tracking:-0.02em;
    --t-metric-weight:calc(var(--fw-metric) + var(--fw-adjust));
    --t-metricval-weight:calc(var(--fw-bold) + var(--fw-adjust));

    /* role: link - inline text link */
    --t-link-size:25px;
    --t-link-tracking:-0.042em;
    --t-link-weight:calc(var(--fw-medium-plus) + var(--fw-adjust));
  }

  /* A scaled canvas keeps its unscaled layout box, so once it scrolls it needs
     a frame sized to what is actually drawn. Inert until then. */
  #frame,.hero,.chartframe,.callout{ display:contents; }

  #stage{ position:fixed; left:50%; top:50%;
           width:calc(var(--canvas-w) * 1px); height:calc(var(--canvas-h) * 1px);
           transform:translate(-50%,-50%) scale(var(--s,1)) translate(var(--shift-x),var(--shift-y));
           transform-origin:50% 50%; z-index:1;
           font-family:var(--font-sans); font-synthesis:none; color:#fff;
           font-variation-settings:'wght' var(--fw-regular); }

  .t-display{ font-size:var(--t-display-size); line-height:var(--t-display-leading);
               letter-spacing:var(--t-display-tracking);
               font-variation-settings:'wght' var(--t-display-weight); }
  .t-heading{ font-size:var(--t-heading-size); line-height:var(--t-heading-leading);
               letter-spacing:var(--t-heading-tracking);
               font-variation-settings:'wght' var(--t-heading-weight); }
  .t-subhead{ font-size:var(--t-subhead-size); line-height:var(--t-subhead-leading);
               letter-spacing:var(--t-subhead-tracking);
               font-variation-settings:'wght' var(--t-subhead-weight); }
  .t-body{    font-size:var(--t-body-size); line-height:var(--t-body-leading);
               letter-spacing:var(--t-body-tracking);
               font-variation-settings:'wght' var(--t-body-weight); }
  .t-label{   font-size:var(--t-label-size); letter-spacing:var(--t-label-tracking);
               font-variation-settings:'wght' var(--t-label-weight); }
  .t-label-strong{ font-size:var(--t-labelstrong-size); letter-spacing:var(--t-labelstrong-tracking);
               font-variation-settings:'wght' var(--t-labelstrong-weight); }
  .t-chip{    font-size:var(--t-chip-size); letter-spacing:var(--t-chip-tracking);
               font-variation-settings:'wght' var(--t-chip-weight); }
  .t-metric{  font-size:var(--t-metric-size); letter-spacing:var(--t-metric-tracking);
               font-variation-settings:'wght' var(--t-metric-weight); }
  .t-metric-value{ font-size:var(--t-metric-size); letter-spacing:var(--t-metric-tracking);
               font-weight:400; font-variation-settings:'wght' var(--t-metricval-weight); }
  .t-link{    font-size:var(--t-link-size); letter-spacing:var(--t-link-tracking);
               font-variation-settings:'wght' var(--t-link-weight); }
  /* The wrappers below are inert (display:contents) until the mobile layout
     turns them into real boxes, so their children keep the same containing
     block and the same absolute placement everywhere above that breakpoint. */
  #stage>*, .hero>*, .chartframe>*, .callout>*{ position:absolute; }

  .panel{ left:96px; top:288px; width:1728px; height:864px; border-radius:80px; z-index:1;

                   background:url(assets/textures/panel-texture.webp) center/100% 100% no-repeat; opacity:0.95; }

  .chart{ left:0; top:0; width:1920px; height:1440px; z-index:3; pointer-events:none; }

  .spo2{ left:1391px; top:578.5px; width:145px; height:51px; border-radius:20px; z-index:4;
          background:rgba(255,255,254,.99); display:flex; align-items:center; justify-content:center;
          gap:7px; box-shadow:0 6px 22px rgba(10,14,34,.18); }
  .spo2 span{ color:#b3bdd2; position:relative; top:-1px; }
  .spo2 b{ color:#26356b; position:relative; top:-1px; }

          box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.05); }

  .chip.outline{ border:2.5px solid rgba(255,255,255,.68); color:#ffffff; }

  .secret{ left:45.5px; top:323px; margin:0; white-space:nowrap;

          color:rgba(230,234,255,.80); }

  .addinfo{ left:131.5px; top:475.5px; width:186px; height:61px; border-radius:30.5px;

             box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); }

  .addinfo:focus-visible, .tip a:focus-visible{ outline:3px solid #ffffff; outline-offset:4px; border-radius:4px; }
  .plus{ width:37px; height:37px; border-radius:50%; background:rgba(255,255,255,.165); margin-left:auto;
          display:flex; align-items:center; justify-content:center; flex:0 0 auto; }

  /* The callout does not have a hard left edge in the prototype: the glass
     (fill *and* backdrop blur) ramps in over the first ~18% of its width, so
     the heart behind stays visible under the marker dot. */
  /* Real glass: the callout sits ABOVE the render and blurs it. Its fill is
     translucent, so the heart reads through the top-left corner softened rather
     than cut away. The marker tab around the dot is part of the same sheet -
     one element, one blur, one fill - so the two never seam or double-tint. */
  .tip-glass{ left:1023px; top:1028px; width:477.5px; height:169.5px; z-index:6;
               backdrop-filter:blur(14px) saturate(1); -webkit-backdrop-filter:blur(14px) saturate(1);
               -webkit-mask-image:url(assets/masks/tip-glass-mask.png); mask-image:url(assets/masks/tip-glass-mask.png);
               -webkit-mask-size:100% 100%; mask-size:100% 100%;
               -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
  .tip-glass::after{ content:''; position:absolute; inset:0;
                      background:url(assets/textures/tip-glass-texture.webp) center/100% 100% no-repeat; opacity:0.5; }
  .tip{ left:1062px; top:1031.5px; width:438.5px; height:166px; z-index:7; pointer-events:none; }
  .tip > *{ pointer-events:auto; }
  .tip p{ position:absolute; left:19.0px; top:22px; margin:0;
           white-space:nowrap; color:#ffffff; }
  .tip a{ position:absolute; left:19.0px; top:118px; white-space:nowrap;
           color:#fff; text-decoration:none; }
  .tip .ul{ position:absolute; left:19.0px; top:145.9px; width:100px; height:1.6px; background:rgba(255,255,255,.85); }
  .dot{ left:1035px; top:1042px; width:17px; height:17px; border-radius:50%; background:#fff;
         z-index:8; box-shadow:0 2px 10px rgba(10,14,34,.30); }



  /* ---- landscape tablet -------------------------------------------------
     A landscape tablet is already the design's own 4:3 shape, so the desktop
     composition needs no rearranging - what it needs is the empty canvas
     margin back. Below 1180px the canvas is trimmed to the artwork itself
     (the panel's box plus the heart's overhang) and recentred, which lifts
     1024x768 from 10.7px body copy to 11.9px without moving one element
     relative to another. Laptops above this width are untouched. */
  @media (max-width:1180px) and (min-aspect-ratio:1/1) {
    :root{ --canvas-w:1728; --canvas-h:1058; --fit-w:1728; --fit-h:1058;
           --shift-x:-96px;  --shift-y:-202px; }
  }

  /* ==================== TABLET ARCHITECTURE ==========================
     The desktop canvas is 4:3 and its panel is 2:1, so on a portrait tablet
     it can only ever occupy a band across the middle - at 834x1112 the body
     copy lands at 9.7px. The break is therefore taken on portrait/square
     viewports narrower than 1120px, which is the width at which that copy
     first drops below ~13px; landscape tablets keep the desktop canvas,
     since 1024x768 is the design's own aspect ratio.

     Below the break the same elements are re-composed onto a portrait canvas:
     panel upright, title above the card, heart carried to the top right, the
     chart moved beneath both. No element is removed, resized in isolation, or
     restyled - only placed. */
  @media (max-width:1120px) and (max-aspect-ratio:1/1) {
    :root{ --canvas-w:1200; --canvas-h:1560; --fit-w:1160; --fit-h:1420; }

    .panel{ left:32px; top:222px; width:1136px; height:1240px; border-radius:60px; }
    .panel::before{ background-image:url(assets/textures/panel-texture-portrait.webp); }

    .title{ left:84px; top:294px; }
    .heart{ left:560px; top:300px; width:620px; height:947px; }
    .halo,.halo2,.halo3{ transform:translate(0px,109px) scale(.9437); transform-origin:0 0; }

    .card{ left:84px; top:512px; }

    /* The lower half mirrors the desktop relationship rather than repeating it:
       the grid still runs the full width of the panel, but the trace sits to the
       LEFT and the heart's base crosses its right end - so the heart occludes
       the trace here exactly as it does on desktop, and the corner that was
       empty carries the reading instead. */
    .chart{ transform:none; }
    .chart-grid,.chart-trace{ transform-box:view-box; transform-origin:0 0; }
    .chart-grid{ transform:translate(-507px,551px) scale(.926); }
    .chart-trace{ transform:translate(-929px,580px) scale(.95); }
    .spo2{ left:386px; top:1129px; }

    .tip-glass{ left:560px; top:950px; }
    .tip{ left:597px; top:953.5px; }
    .dot{ left:572px; top:964px; }
  }


  /* ==================== MOBILE ARCHITECTURE ==========================
     The portrait-tablet canvas is width-driven, so its copy falls below ~13px
     under about 750px - at 390px it is 6.7px and the card is 151px wide. Below
     that the composition is rebuilt as a vertical one on a 600-unit canvas: at
     390px the body copy comes back to 13.9px and the card to 313px.

     A phone cannot hold a 576-unit card, the render, the reading and the
     callout at a legible size in one viewport - the honest arrangement is a
     canvas that scrolls, with the forest staying fixed behind it exactly as it
     does everywhere else. Nothing is removed, stacked blindly or shrunk: the
     render still breaks the panel, the callout still crosses it, and the
     reading still runs under it. */
  @media (max-width:750px) {
    /* ===================== MOBILE ARCHITECTURE =====================
       Above this width the screen is a fixed canvas scaled to fit; a phone
       cannot carry that (at 390px the scaled body copy fell to 10.5px), so the
       canvas is dropped and the same DOM becomes a real layout.

       The whole composition hangs off ONE fluid unit - #stage's font-size,
       bounded by both axes. Type, gaps, padding and the two aspect-locked
       blocks are all expressed in em against it, so the layout scales as a
       whole and can never out-grow the screen: no scrolling, no clipping, no
       per-device rules.

       Structure is a five-row grid. The render row is the only flexible one,
       so it absorbs whatever is left, and the callout hangs off its base
       right-aligned - the same relationship it has on desktop, rather than
       another block in a stack. The reading bleeds to the panel's edges the
       way the grid does on desktop. */
    #stage{
      /* the one fluid unit the whole mobile composition is built from */
      font-size:clamp(9px, min(3.65vw, 2.2vh), 15.5px);

      --pad-outer:.8em;
      --pad-panel:1.15em;
      --stack-gap:.85em;
      --radius-panel:2em;

      /* the type roles keep their names, weights and tracking - only their
         sizes become relative, because nothing is being scaled any more */
      --t-display-size:2.55em;   --t-display-leading:1.06;
      --t-heading-size:1.22em;   --t-heading-leading:1.22;
      --t-subhead-size:1.4em;    --t-subhead-leading:1.18;
      --t-body-size:.95em;       --t-body-leading:1.45;
      --t-label-size:1em;
      --t-labelstrong-size:.95em;
      --t-chip-size:.78em;
      --t-metric-size:.95em;
      --t-link-size:.88em;

      position:fixed; top:0; bottom:0; left:50%; height:100dvh;
      width:min(100%, 500px); transform:translateX(-50%); margin:0;
      display:grid; grid-template-columns:minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr) auto auto auto;
      row-gap:var(--stack-gap);
      padding:calc(var(--pad-outer) + var(--pad-panel));
    }

    html,body{ overflow:hidden; }
    #frame{ display:block; }

    /* placement from the canvas tiers is cleared once; everything below is
       expressed relatively, so nothing carries a canvas offset */
    #stage>*, .hero>*, .chartframe>*, .callout>*{
      position:relative; left:auto; top:auto; right:auto; bottom:auto; }
    /* Every block owns the single column - two blocks sharing a row overlap by
       design. The panel is excluded: an absolutely positioned grid child that
       is given a grid line is placed against its grid area rather than the
       stage's padding box, which would inset the surface twice. */
    #stage>*:not(.panel){ grid-column:1; }

    #stage>.panel{ position:absolute; inset:var(--pad-outer); width:auto; height:auto;
                    border-radius:var(--radius-panel); }
    .panel::before{ background-image:url(assets/textures/panel-texture-fluid.webp); }

    .title{ grid-row:1; width:auto; margin:0; }

    /* the render is the flexible row: it takes whatever the others leave */
    /* The render is not one of the bands - it stands BEHIND them, spanning from
       under the title down through the callout and the reading, the way it
       spans the whole panel on desktop. That is what lets it stay large on a
       phone: it is no longer competing with the text blocks for height, it is
       the surface they sit on. The trace passes behind it and re-emerges either
       side, exactly as it does on the wider tiers. */
    .hero{ grid-row:2 / span 3; z-index:5; display:flex; align-items:center;
            justify-content:flex-start; min-height:0; pointer-events:none;
            padding:0 0 25% 3%; }
    .heart{ position:relative; width:auto; height:100%; max-width:92%;
             object-fit:contain; filter:drop-shadow(0 0 34px rgba(150,180,255,.22)); }
    /* the glow follows the render's own centre, not the row's */
    .halo,.halo2,.halo3{ position:absolute; left:32%; top:auto;
                          bottom:14%;
                          width:78%; height:44%; transform:translateX(-50%); }
    .halo2{ width:50%; height:30%; }
    .halo3{ width:62%; height:22%; }

    .callout{ grid-row:3; display:block; justify-self:end; z-index:7;
               width:17em; max-width:100%; aspect-ratio:477.5 / 169.5;
               margin-right:-.2em; }
    .tip-glass{ position:absolute; inset:0; width:auto; height:auto; }
    .tip{ position:absolute; inset:0; width:auto; height:auto;
           display:flex; flex-direction:column; justify-content:center;
           gap:4%; padding:0 6% 0 12.5%; }
    .tip p,.tip a{ position:relative; left:auto; top:auto; margin:0; }
    .tip a{ align-self:flex-start; text-decoration:underline;
             text-underline-offset:.22em; text-decoration-thickness:.06em; }
    .tip .ul{ display:none; }
    .dot{ position:absolute; left:2.5%; top:8%; width:3.6%; height:auto;
           aspect-ratio:1; }

    /* the pill keeps its place over the connector: 1461 is the marker's x in
       the drawing, so it is that fraction of the window's width */
    #stage>.spo2{ grid-row:4; align-self:start; justify-self:start; z-index:6;
            left:calc(100% * (1461 - 1080) / 720);
            transform:translate(-50%, -52%);
            width:auto; height:auto; padding:.32em .7em; border-radius:99px;
            gap:.34em; }
    .spo2 span,.spo2 b{ top:0; }

    /* The reading is windowed rather than re-drawn: the frame shows the region
       x 1080-1800, y 620-810 of the chart's own coordinate space, so the trace,
       grid, connector and marker keep their exact geometry. The offsets are the
       window's origin as a fraction of the drawing itself (1080/1920, 620/1440),
       which is why they hold whatever height the frame ends up with. It bleeds
       to the panel's edges, as the grid does on desktop. */
    /* the frame's aspect IS the window's aspect, so the region is shown whole at
       every width - the trace can never be cropped top or bottom */
    .chartframe{ grid-row:4; display:block; position:relative; overflow:hidden;
                  z-index:6; aspect-ratio:720 / 190;
                  width:calc(100% + 2 * var(--pad-panel));
                  margin-inline:calc(var(--pad-panel) * -1); }
    .chart{ position:absolute; left:0; top:0; height:auto;
             width:calc(100% * 1920 / 720);
             transform:translate(calc(-100% * 1080 / 1920), calc(-100% * 620 / 1440)); }
    .chart-grid,.chart-trace{ transform:none; }

    /* card: same component, laid out in flow instead of placed */
    .card{ grid-row:5; position:relative; width:100%; height:auto;
            border-radius:1.6em; display:flex; flex-direction:column;
            align-items:flex-start; gap:.5em; padding:1.15em; }
    #stage>.card>*{ position:relative; left:auto; top:auto; }
    .card h2{ width:calc(100% - 5.2em); }
    #stage>.card>.thumb{ position:absolute; right:1.15em; top:1.15em;
                          width:4em; height:auto; aspect-ratio:1; }
    .chips{ display:flex; gap:.5em; }
    .chip{ height:auto; padding:.34em .78em; border-radius:99px; }
    .chip.solid{ padding:.34em .78em; }
    .chip span{ top:0; }
    .secret{ margin-top:.15em; }
    /* the designed line breaks stay; they simply wrap if a narrow phone needs it */
    .body{ white-space:normal; }
    .addinfo{ align-self:center; width:auto; height:auto; margin-top:.35em;
               padding:.62em 1.5em .62em 1.9em; gap:.9em; border-radius:99px; }
    .addinfo em{ top:0; }
    .plus{ width:1.55em; height:1.55em; margin-left:0; }
  }


  /* ============================= ENTRANCE ============================
     A one-shot opening sequence. Everything in this block is either a
     masking box for a line reveal, a transform reference for one of the
     SVG hooks, or a holding state that exists only until the sequence
     takes over. None of it has any effect on the finished screen: the
     resting frame is the design exactly as authored above.

     Four behaviours carry the whole thing, and each is taken from what
     the screen already is rather than from an effects list:
       glass MATERIALISES in place - it condenses, it does not slide;
       type RISES out of its own line box;
       the render SETTLES into the composition;
       the reading DRAWS itself, the way a trace is actually written. */

  /* The line box doubles as the mask. The padding keeps descenders clear
     of the clip edge and the negative margin hands the height straight
     back, so each line occupies exactly the space the plain <br> did. */
  .ln{ display:block; overflow:hidden; padding-bottom:.14em; margin-bottom:-.14em; }
  .ln>span{ display:block; }

  /* Hooks with no geometry of their own, so the marker, the connector and
     the rule can be moved without touching the drawing's coordinates. */
  .mk{ transform-box:view-box; transform-origin:1460px 739px; }
  .cn{ transform-box:view-box; transform-origin:1461px 712px; }
  .spo2{ transform-origin:50% 100%; }   /* it unfolds off the connector's tip */
  .tip .ul{ transform-origin:0 50%; }

  /* The holding state, set by an inline script in <head> so the screen is
     never painted before the sequence owns it, and dropped by the sequence
     on its first frame. If that script never runs, or the sequence fails,
     the class is simply removed and the page is the finished design. */
  .pre .panel,.pre .card,.pre .tip-glass,.pre .halo,.pre .halo2,.pre .halo3,
  .pre .heart,.pre .chart-grid,.pre .mk,.pre .cn,.pre .spo2,.pre .dot,
  .pre .card h2,.pre .secret,.pre .body,.pre .addinfo,
  .pre .tip a,.pre .tip .ul{ opacity:0; }
  .pre .ln>span{ transform:translateY(120%); }
  .pre .chart-trace path{ visibility:hidden; }

  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>
</head>
<body>

  <div id="frame"><main id="stage">

<script>
  /* The 1920x1440 reference canvas is scaled uniformly: never letterboxed, never
     distorted, and never cropping the panel or the heart.
       cover   - smallest scale at which the canvas fills the viewport
       content - largest scale at which the panel (x 96-1824) and the heart
                 (y 202-1205) both stay fully inside the viewport
     The stage takes min(cover, content); the backdrop takes max(stage, cover) so
     the forest always reaches every edge - no blank space, top, bottom or side. */
  (function () {
    var frame = document.getElementById('frame'),
        stage = document.getElementById('stage'),
        bg    = document.getElementById('bg');
    function num(p) { return parseFloat(getComputedStyle(stage).getPropertyValue(p)); }
    function fit() {
      var vw = window.innerWidth, vh = window.innerHeight,
          cw = num('--canvas-w'), ch = num('--canvas-h'),
          fw = num('--fit-w'),    fh = num('--fit-h'),
          flow = num('--flow') === 1, s;
      if (flow) {
        /* the canvas is taller than any phone: fit its width, scroll its height */
        s = Math.min(vw / fw, vh / num('--fit-vh'), 1);   /* never larger than the design */
        frame.style.height = (ch * s) + 'px';
      } else {
        s = Math.min(Math.max(vw / cw, vh / ch), Math.min(vw / fw, vh / fh));
        frame.style.height = '';
      }
      stage.style.setProperty('--s', s);
      bg.style.transform = 'translate(-50%,-50%) scale(' +
        Math.max(vw / 1920, vh / 1440) + ')';
    }
    fit();
    window.addEventListener('resize', fit, { passive: true });
    window.addEventListener('orientationchange', fit);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  })();
</script>

<script>
  /* ============================== ENTRANCE ==============================
     One master timeline. It runs once, on the first paint, and then the
     screen is the static design for the rest of its life - no scroll
     hooks, no hover motion, no idle loop, nothing left playing.

     THE SCORE - the order is the composition's own, not the DOM's, and
     it is written so the eye is handed from one area to the next:

       0.00  the glass forms out of the forest .............. panel
       0.14  light gathers where the render will be ......... halos
       0.26  the screen names itself ........................ title, line by line
       0.50  the subject arrives .............. CENTRE ...... render
       0.82  the left column fills in ......... LEFT ........ card, then its words
       1.20  the field under the reading appears ............ grid
       1.30  the reading writes itself out
             from behind the render ......... RIGHT ........ trace
       1.76  it reaches the valve, which sends the
             figure up to the readout ....................... marker, connector, SpO2
       1.98  the point is marked, and then
             explained ...................... BOTTOM ....... dot, callout
       2.88  complete - and nothing moves again

     Beats overlap at their tails - each starts while the one before it is
     still resolving - so the screen reads as one composition assembling
     itself rather than a queue of elements taking turns. What does NOT
     overlap is the two endings: the readout finishes before the callout
     begins, because both are conclusions and they would otherwise argue
     over where the eye should come to rest. It rests on the callout.

     On a phone the same beats are re-ordered to the mobile stack, where
     the callout sits on the render and the reading and the card are the
     last two blocks down the page; every distance is scaled down with
     it. Same motion language, less travel. */
  (function () {
    var root = document.documentElement,
        pre  = function () { clearTimeout(window.__pre);
                             root.classList.remove('pre'); };

    /* Reduced motion, or a browser without the animation API: no sequence
       at all - the finished screen, immediately. */
    if (!('animate' in Element.prototype) ||
        matchMedia('(prefers-reduced-motion: reduce)').matches) { pre(); return; }

    var $  = function (s) { return document.querySelector(s); },
        $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };

    /* Read once. One page initialisation produces one entrance: nothing
       here re-reads the viewport, so a resize mid-sequence cannot restart
       or re-time it. */
    var sm = matchMedia('(max-width:750px)').matches,
        k  = sm ? .6 : 1;                    /* travel scale, not a re-design */

    /* Easing. Entrances decelerate; nothing overshoots, bounces or springs.
       EXPO carries the two statements and the render - it covers most of
       its distance early, which is what lets a long reveal still feel
       fast. OUT is the everyday settle. GLASS is nearly symmetrical, so a
       surface appears to thicken rather than snap in. DRAW is the only
       in-out curve: a trace is written with a hand, not thrown. */
    var EXPO  = 'cubic-bezier(.16,1,.3,1)',
        OUT   = 'cubic-bezier(.22,.9,.28,1)',
        GLASS = 'cubic-bezier(.25,.5,.3,1)',
        DRAW  = 'cubic-bezier(.45,.05,.25,1)';

    /* The sequence waits on the two things it cannot open without: the
       typeface (font-display is block, so the title would otherwise rise
       invisibly) and the render's own bitmap. The wait is capped, and it
       is not a loader - what is on screen meanwhile is the forest, which
       is where this screen starts anyway. */
    var gate = setTimeout(open, 1200), opened = false;
    Promise.all([document.fonts ? document.fonts.ready : 0,
                 decode($('#bg')), decode($('.heart'))]).then(open, open);

    function decode(img) {
      return img && img.decode ? img.decode().catch(function () {}) : 0;
    }
    function open() {
      if (opened) { return; }                /* one initialisation, one entrance */
      opened = true; clearTimeout(gate); play();
    }

    function play() {
      var A = [];                            /* the timeline itself */
      function cue(t, el, frames, dur, ease) {
        if (!el) { return; }
        A.push(el.animate(frames, { delay: t * 1000, duration: dur * 1000,
                                    easing: ease, fill: 'backwards' }));
      }

      /* the four behaviours */
      var MATERIALISE = [{ opacity: 0 }, { opacity: 1 }];
      function settle(d) {                                  /* supporting content */
        return [{ opacity: 0, transform: 'translateY(' + (d * k) + 'px)' },
                { opacity: 1, transform: 'none' }];
      }
      var RISE = [{ transform: 'translateY(120%)' },         /* masked line */
                  { transform: 'none' }];
      var ARRIVE = [{ opacity: 0, transform: 'translateY(' + (16 * k) +
                                  'px) scale(' + (sm ? .988 : .978) + ')' },
                    { opacity: 1, transform: 'none' }];      /* the render */

      /* The two scores. Both run the same beats in the order their own
         layout reads in - on desktop the card is the left column and the
         reading crosses the panel to the right of it; on a phone the
         reading and the card are the last two blocks down the stack. */
      var T = sm
        ? { panel:0, halo:.12, title:.24, heart:.46, dot:.98, tip:1.04,
            grid:1.46, trace:1.56, mark:2.00, pill:2.16, card:2.06 }
        : { panel:0, halo:.14, title:.26, heart:.50, card:.82, grid:1.20,
            trace:1.30, mark:1.76, pill:1.92, dot:1.98, tip:2.06 };

      /* --- the surface, and the light that precedes the render ------- */
      cue(T.panel, $('.panel'), MATERIALISE, .9, GLASS);
      /* three coincident gradients that read as one glow, so they are given
         one timing rather than a stagger - and they finish ahead of the
         render, which is what makes the render feel expected */
      $$('.halo,.halo2,.halo3').forEach(function (el) {
        cue(T.halo, el, MATERIALISE, .8, GLASS);
      });

      /* --- the screen names itself ----------------------------------- */
      $$('.title .ln>span').forEach(function (el, i) {
        cue(T.title + i * .09, el, RISE, .86, EXPO);
      });

      /* --- the subject ----------------------------------------------- */
      cue(T.heart, $('.heart'), ARRIVE, 1.1, EXPO);

      /* --- the card: the surface condenses, its contents settle into it */
      cue(T.card, $('.card'), MATERIALISE, .72, GLASS);
      /* Only the words are given their own motion. The portrait and the two
         pills are furniture: they come up inside the surface's own fade,
         which is what keeps this a card arriving rather than six things
         arriving. The offsets are not an even stagger either - headline,
         then the label and its paragraph as one pair, then the button a
         beat later, which is how the card is actually read. */
      [['.card h2', .12], ['.secret', .19], ['.body', .24], ['.addinfo', .31]]
        .forEach(function (b) {
          cue(T.card + b[1], $(b[0]), settle(14), .52, OUT);
        });

      /* --- the reading: field, signal, then what the signal found ----- */
      cue(T.grid, $('.chart-grid'), MATERIALISE, .55, GLASS);

      /* Only the dash pattern is written to the element; the offset that
         hides the line is the tween's own backwards fill. That way the
         moment the draw ends the offset falls back to nought and the
         stroke simply stays drawn - it cannot revert to a held-back state
         while the rest of the sequence plays out. */
      var trace = $('.chart-trace path'),
          len   = Math.ceil(trace.getTotalLength());
      trace.style.strokeDasharray = len + ' ' + len;
      A.push(trace.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { delay: T.trace * 1000, duration: 950, easing: DRAW, fill: 'backwards' }));

      cue(T.mark,       $('.mk'), [{ opacity: 0, transform: 'scale(.55)' },
                                   { opacity: 1, transform: 'none' }], .42, EXPO);
      cue(T.mark + .06, $('.cn'), [{ transform: 'scaleY(0)' },
                                   { transform: 'none' }], .4, OUT);
      /* the readout is the one place the phone differs: its pill already
         carries a centring transform there, so it is faded, not scaled */
      cue(T.pill, $('.spo2'), sm ? MATERIALISE
                                 : [{ opacity: 0, transform: 'scale(.92)' },
                                    { opacity: 1, transform: 'none' }], .48, OUT);

      /* --- the point is marked, then explained ------------------------ */
      cue(T.dot, $('.dot'), [{ opacity: 0, transform: 'scale(.4)' },
                             { opacity: 1, transform: 'none' }], .38, EXPO);
      cue(T.tip, $('.tip-glass'), MATERIALISE, .62, GLASS);
      $$('.tip .ln>span').forEach(function (el, i) {
        cue(T.tip + .10 + i * .08, el, RISE, .64, EXPO);
      });
      cue(T.tip + .32, $('.tip a'),   settle(10), .46, OUT);
      cue(T.tip + .37, $('.tip .ul'), [{ opacity: 0, transform: 'scaleX(0)' },
                                       { opacity: 1, transform: 'none' }], .42, OUT);

      /* One time origin for every tween, so the score is exact rather than
         however long the block above took to build. */
      try {
        var t0 = document.timeline.currentTime;
        A.forEach(function (a) { a.startTime = t0; });
      } catch (e) {}

      /* Only the surfaces that actually move get a layer hint, and only
         for the length of the sequence. */
      var hinted = [[$('.heart'), 'transform,opacity'], [$('.panel'), 'opacity'],
                    [$('.card'), 'opacity'], [$('.tip-glass'), 'opacity']];
      hinted.forEach(function (h) { if (h[0]) { h[0].style.willChange = h[1]; } });

      pre();                     /* same task as the tweens: no flash between */

      /* Full stop. Each tween is cancelled once it has finished, which
         leaves its element rendering the authored CSS and empties
         document.getAnimations(); the drawing gets its plain stroke back
         and the layer hints are dropped. After this there is no timeline,
         no listener, no timer and no frame loop left from the entrance. */
      Promise.all(A.map(function (a) { return a.finished; })).then(stop, stop);
      function stop() {
        A.forEach(function (a) { try { a.cancel(); } catch (e) {} });
        A.length = 0;
        trace.style.strokeDasharray = '';
        hinted.forEach(function (h) { if (h[0]) { h[0].style.willChange = ''; } });
      }
    }
  })();
</script>
</body>
